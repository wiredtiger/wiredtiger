version: '3.0'

services:
  wiredtiger:
    container_name: wiredtiger
    hostname: wiredtiger
    image: wt-test-format:wt-willk
    entrypoint:
          - /bin/sh
          - -c
          - |
            env
            echo "format test script args?: $FORMAT_TEST_SCRIPT_ARGS"
            echo '{"antithesis_setup": { "status": "complete", "details": {"message": "Set up complete - ready for testing!" }}}' >> $ANTITHESIS_OUTPUT_DIR/sdk.jsonl
            # format does no networking of its own; emit a trickle of bridge traffic so the
            # "Containers joined the Antithesis network" property has something to observe.
            while true; do ping -c 1 10.20.20.1 > /dev/null 2>&1; sleep 60; done &
            # memory_max=$(cat /proc/meminfo | grep "MemTotal: " | grep -o "[[:digit:]]*")
            # memory_max=$(( ($memory_max * 8) / (${num_jobs} * 1024 * 10) ))
            /opt/bin/test.sh -c CONFIG.antithesis -h /data/RUNDIR -T bulk,txn,retain=50
    environment:
        FORMAT_TEST_SCRIPT_ARGS: "${FORMAT_TEST_SCRIPT_ARGS}"
    volumes:
      - ./data/wiredtiger:/data/
      - type: bind
        source: ./CONFIG.antithesis
        target: /opt/bin/test/format/CONFIG.antithesis
    networks:
      antithesis-net:
        ipv4_address: 10.20.20.6
        # Set the an IPv4 with an address of 10.20.20.130 or higher
        # to be ignored by the fault injector

networks:
  antithesis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.20.0/24
