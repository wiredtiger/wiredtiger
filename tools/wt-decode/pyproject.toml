[project]
name = "wt-decode"
version = "0.2.0"
description = "WiredTiger page and file decoder"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
checksum = ["crc32c>=2.8"]
compression = ["python-snappy>=0.7.3"]
bson = ["pymongo>=4.16.0"]
disagg = [
    "grpcio>=1.60",
    "protobuf>=5.0",
    "pymongo>=4.16.0",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
    "questionary>=2.1",
]
all = ["wt-decode[checksum,compression,bson,disagg,cli]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
wtd = "wt_decode.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
