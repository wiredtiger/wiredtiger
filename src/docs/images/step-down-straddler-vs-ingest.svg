<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img">
<title>A straddler and an ingest writer can both write key K; the straddler cannot commit</title>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfcf" stroke-width="3"/></pattern>
<marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arrow-vis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="1200" height="470" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="16.0" y="22.0">A straddler and an ingest writer can both write key K; the straddler cannot commit</tspan></text>
<rect x="8" y="44" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="93.0">Straddler T1</tspan></text>
<rect x="8" y="188" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="229.5">Setting the</tspan><tspan x="18.0" y="244.5">step-down ts</tspan></text>
<rect x="8" y="332" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="373.5">Writer T2</tspan><tspan x="18.0" y="388.5">(ingest)</tspan></text>
<line x1="170" y1="448" x2="1186" y2="448" stroke="#999999" marker-end="url(#arrow-hb)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" fill="#777777" text-anchor="end" dominant-baseline="middle"><tspan x="1180.0" y="460.0">time</tspan></text>
<g><rect x="170.0" y="47" width="120.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="10.3" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="58.0">begin_transaction</tspan></text></g>
<g><rect x="176.7" y="69" width="107.3" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="230.4" y="87.5">step-down</tspan><tspan x="230.4" y="101.5">ts not set</tspan></text></g>
<g><rect x="297.4" y="191" width="207.9" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="8.8" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="304.4" y="202.0">set_timestamp(step_down_timestamp=N)</tspan></text></g>
<g><rect x="304.1" y="69" width="201.2" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="370.0" y="85.5" width="69.4" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="404.7" y="94.5">suspended</tspan></text></g>
<g><rect x="304.1" y="213" width="194.5" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="401.4" y="238.5">set step-down ts</tspan></text></g>
<g><rect x="304.1" y="268" width="194.5" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="401.4" y="274.8">write lock</tspan></text></g>
<g><rect x="518.7" y="47" width="295.1" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="525.7" y="58.0">insert</tspan></text></g>
<g><rect x="518.7" y="335" width="120.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="10.3" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="525.7" y="346.0">begin_transaction</tspan></text></g>
<g><rect x="525.5" y="69" width="134.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="592.5" y="87.5">check without lock</tspan><tspan x="592.5" y="101.5">can miss the set</tspan></text></g>
<g><rect x="525.5" y="357" width="107.3" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="579.1" y="375.5">step-down</tspan><tspan x="579.1" y="389.5">ts set</tspan></text></g>
<g><rect x="525.5" y="412" width="107.3" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="579.1" y="418.8">read lock</tspan></text></g>
<g><path d="M498.6,286.0 L498.6,309.0 L525.5,309.0 L525.5,329.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="533.5" y="309.0">lock hand-off</tspan></text></g>
<g><rect x="652.9" y="335" width="321.9" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="659.9" y="346.0">insert</tspan></text></g>
<g><rect x="659.6" y="357" width="107.3" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.4" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="713.2" y="382.5">write K to ingest</tspan></text></g>
<g><rect x="673.0" y="69" width="134.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="740.1" y="87.5">write K to stable</tspan><tspan x="740.1" y="101.5">(uncommitted)</tspan></text></g>
<g><path d="M740.1,142.0 L740.1,305.4 L713.2,305.4 L713.2,332.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="2 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#8a8a8a" text-anchor="start" dominant-baseline="middle"><tspan x="748.1" y="305.4">no ordering between the writes</tspan></text></g>
<g><rect x="780.3" y="357" width="187.8" height="51" rx="5" fill="#fff4d6" stroke="#c79a00" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#5c4600" text-anchor="middle" dominant-baseline="middle"><tspan x="874.2" y="375.5">may see T1&#x27;s update and</tspan><tspan x="874.2" y="389.5">roll back too (safe)</tspan></text></g>
<g><rect x="827.3" y="47" width="348.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="834.3" y="58.0">commit_transaction</tspan></text></g>
<g><rect x="834.0" y="69" width="80.5" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="874.2" y="87.5">step-down</tspan><tspan x="874.2" y="101.5">ts set</tspan></text></g>
<g><rect x="834.0" y="124" width="80.5" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="874.2" y="130.8">read lock</tspan></text></g>
<g><path d="M498.6,188.0 L498.6,169.6 L860.8,169.6 L860.8,145.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><rect x="631.8" y="161.6" width="95.8" height="16" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="679.7" y="169.6">lock hand-off</tspan></text></g>
<g><rect x="927.9" y="69" width="241.4" height="51" rx="5" fill="#fff4d6" stroke="#c79a00" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#5c4600" text-anchor="middle" dominant-baseline="middle"><tspan x="1048.6" y="87.5">WT_ROLLBACK:</tspan><tspan x="1048.6" y="101.5">updates aborted</tspan></text></g>
</svg>
