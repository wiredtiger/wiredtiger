<g><path d="M525.5,142.0 L525.5,165.0 L545.6,165.0 L545.6,185.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="553.6" y="165.0">lock hand-off</tspan></text></g>
<g><rect x="787.0" y="335" width="187.8" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="794.0" y="346.0">begin_transaction</tspan></text></g>
<g><rect x="793.7" y="357" width="80.5" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="834.0" y="375.5">acquire</tspan><tspan x="834.0" y="389.5">snapshot</tspan></text></g>
<g><rect x="887.6" y="357" width="80.5" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="927.9" y="375.5">step-down</tspan><tspan x="927.9" y="389.5">ts set</tspan></text></g>
<g><rect x="887.6" y="412" width="80.5" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="927.9" y="418.8">read lock</tspan></text></g>
<g><path d="M766.9,286.0 L766.9,297.5 L887.6,297.5 L887.6,329.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><rect x="779.4" y="289.5" width="95.8" height="16" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="827.3" y="297.5">lock hand-off</tspan></text></g>
<g><rect x="988.2" y="335" width="187.8" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="995.2" y="346.0">insert</tspan></text></g>
<g><rect x="994.9" y="357" width="87.2" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.1" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="1038.5" y="376.4">write K: check</tspan><tspan x="1038.5" y="388.6">stable too</tspan></text></g>
<g><path d="M364.5,142.0 L364.5,320.6 L1041.9,320.6 L1041.9,329.0" fill="none" stroke="#1f4fd8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-vis)"/><rect x="619.0" y="312.6" width="168.4" height="16" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#1f4fd8" text-anchor="middle" dominant-baseline="middle"><tspan x="703.2" y="320.6">published update visible</tspan></text></g>
<g><rect x="1095.5" y="357" width="73.8" height="51" rx="5" fill="#e3f6e5" stroke="#2e8b3e" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#14531f" text-anchor="middle" dominant-baseline="middle"><tspan x="1132.4" y="375.5">conflict</tspan><tspan x="1132.4" y="389.5">with T1</tspan></text></g>
