<g><rect x="445.0" y="124" width="80.5" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="485.2" y="130.8">read lock</tspan></text></g>
<g><rect x="538.9" y="69" width="187.8" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="632.8" y="94.5">rest of commit</tspan></text></g>
<g><rect x="538.9" y="191" width="234.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="10.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="545.9" y="202.0">set_timestamp(step_down_timestamp=N)</tspan></text></g>
<g><rect x="545.6" y="213" width="221.3" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="656.2" y="238.5">set step-down ts</tspan></text></g>
