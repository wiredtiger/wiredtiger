<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 264" width="1200" height="264" role="img">
<title>How to read the step-down diagrams</title>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfcf" stroke-width="3"/></pattern>
<marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arrow-vis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="1200" height="264" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="16.0" y="22.0">How to read the step-down diagrams</tspan></text>
<rect x="8" y="44" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="93.0">Steps</tspan></text>
<rect x="8" y="156" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="205.0">Arrows</tspan></text>
<line visibility="hidden" x1="170" y1="242" x2="1186" y2="242" stroke="#999999" marker-end="url(#arrow-hb)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" fill="none" text-anchor="end" dominant-baseline="middle"><tspan x="1180.0" y="254.0">time</tspan></text>
<g><rect x="170.0" y="47" width="318.6" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="58.0">API call</tspan></text></g>
<g><line x1="170.0" y1="205.0" x2="220.0" y2="205.0" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="228.0" y="205.0">lock hand-off (happens-before)</tspan></text></g>
<g><line x1="421.5" y1="205.0" x2="471.5" y2="205.0" stroke="#1f4fd8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-vis)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="479.5" y="205.0">guaranteed visible</tspan></text></g>
<g><line x1="673.0" y1="205.0" x2="723.0" y2="205.0" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrow-bad)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="731.0" y="205.0">ordering that causes the problem</tspan></text></g>
<g><line x1="924.5" y1="205.0" x2="974.5" y2="205.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="2 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="982.5" y="205.0">no ordering</tspan></text></g>
<g><rect x="178.4" y="69" width="134.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="245.4" y="94.5">step</tspan></text></g>
<g><rect x="329.3" y="69" width="150.9" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="404.7" y="87.5">step under the</tspan><tspan x="404.7" y="101.5">step-down lock</tspan></text></g>
<g><rect x="329.3" y="124" width="150.9" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="404.7" y="130.8">lock held</tspan></text></g>
<g><rect x="505.3" y="69" width="184.4" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="526.5" y="85.5" width="142.0" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="597.5" y="94.5">suspended or waiting</tspan></text></g>
<g><rect x="706.5" y="69" width="218.0" height="51" rx="5" fill="#e3f6e5" stroke="#2e8b3e" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#14531f" text-anchor="middle" dominant-baseline="middle"><tspan x="815.5" y="94.5">intended outcome</tspan></text></g>
<g><rect x="941.3" y="69" width="234.7" height="51" rx="5" fill="#fff4d6" stroke="#c79a00" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#5c4600" text-anchor="middle" dominant-baseline="middle"><tspan x="1058.6" y="94.5">rollback or retry</tspan></text></g>
</svg>
