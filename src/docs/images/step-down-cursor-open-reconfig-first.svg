<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" width="1200" height="326" role="img">
<title>Reconfiguration takes the schema lock first: the fresh open waits, then retries</title>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfcf" stroke-width="3"/></pattern>
<marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arrow-vis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="1200" height="326" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="16.0" y="22.0">Reconfiguration takes the schema lock first: the fresh open waits, then retries</tspan></text>
<rect x="8" y="44" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="85.5">Step-down</tspan><tspan x="18.0" y="100.5">reconfiguration</tspan></text>
<rect x="8" y="188" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="237.0">Cursor operation</tspan></text>
<line x1="170" y1="304" x2="1186" y2="304" stroke="#999999" marker-end="url(#arrow-hb)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" fill="#777777" text-anchor="end" dominant-baseline="middle"><tspan x="1180.0" y="316.0">time</tspan></text>
<g><rect x="170.0" y="47" width="588.1" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="58.0">reconfigure(role=follower)</tspan></text></g>
<g><rect x="177.7" y="69" width="92.9" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="224.2" y="87.5">take schema</tspan><tspan x="224.2" y="101.5">lock</tspan></text></g>
<g><rect x="224.2" y="124" width="526.2" height="13" rx="3" fill="#d9c8f2" stroke="#7e5bb5" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="487.3" y="130.8">schema lock held by the step-down reconfiguration</tspan></text></g>
<g><rect x="278.3" y="191" width="897.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="285.3" y="202.0">search</tspan></text></g>
<g><rect x="286.1" y="69" width="131.6" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="351.9" y="87.5">mark stable data</tspan><tspan x="351.9" y="101.5">handle outdated</tspan></text></g>
<g><rect x="286.1" y="213" width="108.3" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="340.2" y="231.5">load role</tspan><tspan x="340.2" y="245.5">= leader</tspan></text></g>
<g><rect x="425.4" y="213" width="139.3" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="495.0" y="231.9">lookup skips outdated</tspan><tspan x="495.0" y="245.1">handle: fresh open</tspan></text></g>
<g><rect x="433.1" y="69" width="139.3" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="502.8" y="87.5">publish role</tspan><tspan x="502.8" y="101.5">= follower</tspan></text></g>
<g><rect x="580.1" y="213" width="170.2" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="591.0" y="229.5" width="148.6" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="665.3" y="238.5">waits for schema lock</tspan></text></g>
<g><rect x="657.5" y="69" width="92.9" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="704.0" y="87.5">release</tspan><tspan x="704.0" y="101.5">schema lock</tspan></text></g>
<g><rect x="765.9" y="213" width="116.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="823.9" y="231.5">observe role</tspan><tspan x="823.9" y="245.5">= follower</tspan></text></g>
<g><rect x="765.9" y="268" width="116.1" height="13" rx="3" fill="#d9c8f2" stroke="#7e5bb5" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="823.9" y="274.8">schema lock</tspan></text></g>
<g><path d="M750.4,142.0 L750.4,165.0 L765.9,165.0 L765.9,185.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="773.9" y="165.0">lock hand-off</tspan></text></g>
<g><rect x="897.4" y="213" width="116.1" height="51" rx="5" fill="#fff4d6" stroke="#c79a00" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#5c4600" text-anchor="middle" dominant-baseline="middle"><tspan x="955.5" y="232.1">live open refused:</tspan><tspan x="955.5" y="244.9">retry operation</tspan></text></g>
<g><rect x="1029.0" y="213" width="139.3" height="51" rx="5" fill="#e3f6e5" stroke="#2e8b3e" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#14531f" text-anchor="middle" dominant-baseline="middle"><tspan x="1098.6" y="231.5">open checkpoint</tspan><tspan x="1098.6" y="245.5">view</tspan></text></g>
</svg>
