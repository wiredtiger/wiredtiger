<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" width="1200" height="326" role="img">
<title>Table creation takes the schema lock first: it creates both constituents</title>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfcf" stroke-width="3"/></pattern>
<marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arrow-vis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="1200" height="326" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="16.0" y="22.0">Table creation takes the schema lock first: it creates both constituents</tspan></text>
<rect x="8" y="44" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="85.5">Setting the</tspan><tspan x="18.0" y="100.5">step-down ts</tspan></text>
<rect x="8" y="188" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="229.5">Schema</tspan><tspan x="18.0" y="244.5">operations</tspan></text>
<line x1="170" y1="304" x2="1186" y2="304" stroke="#999999" marker-end="url(#arrow-hb)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" fill="#777777" text-anchor="end" dominant-baseline="middle"><tspan x="1180.0" y="316.0">time</tspan></text>
<g><rect x="170.0" y="191" width="452.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="202.0">create</tspan></text></g>
<g><rect x="195.2" y="213" width="402.4" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="396.3" y="231.5">create layered table:</tspan><tspan x="396.3" y="245.5">stable + ingest</tspan></text></g>
<g><rect x="195.2" y="268" width="402.4" height="13" rx="3" fill="#d9c8f2" stroke="#7e5bb5" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="396.3" y="274.8">schema lock</tspan></text></g>
<g><rect x="245.4" y="47" width="679.0" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="252.4" y="58.0">set_timestamp(step_down_timestamp=N)</tspan></text></g>
<g><rect x="270.6" y="69" width="326.9" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="359.8" y="85.5" width="148.6" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="434.1" y="94.5">waits for schema lock</tspan></text></g>
<g><rect x="622.7" y="69" width="276.6" height="51" rx="5" fill="#1f4fd8" stroke="#1238a8" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="761.0" y="94.5">set step-down ts</tspan></text></g>
<g><rect x="622.7" y="124" width="276.6" height="13" rx="3" fill="#d9c8f2" stroke="#7e5bb5" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="761.0" y="130.8">schema lock</tspan></text></g>
<g><path d="M597.5,188.0 L597.5,165.0 L622.7,165.0 L622.7,145.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="630.7" y="165.0">lock hand-off</tspan></text></g>
