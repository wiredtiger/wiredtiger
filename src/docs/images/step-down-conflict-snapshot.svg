<g><rect x="735.9" y="412" width="81.7" height="13" rx="3" fill="#f6c9c9" stroke="#c46b6b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="776.7" y="418.8">read lock</tspan></text></g>
