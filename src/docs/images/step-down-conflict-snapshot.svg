<g><path d="M396.4,332.0 L396.4,153.4 L842.8,153.4 L842.8,145.0" fill="none" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrow-bad)"/><rect x="518.9" y="145.4" width="201.4" height="16" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#c62828" text-anchor="middle" dominant-baseline="middle"><tspan x="619.6" y="153.4">snapshot precedes T1&#x27;s commit</tspan></text></g>
