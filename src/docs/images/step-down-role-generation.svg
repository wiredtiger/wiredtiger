<g><rect x="618.8" y="501" width="139.3" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="688.5" y="519.5">recheck: role and</tspan><tspan x="688.5" y="533.5">gen changed</tspan></text></g>
<g><rect x="727.2" y="335" width="325.0" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="734.2" y="346.0">search</tspan></text></g>
