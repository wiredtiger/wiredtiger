<g><rect x="773.6" y="501" width="123.8" height="51" rx="5" fill="#fff4d6" stroke="#c79a00" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#5c4600" text-anchor="middle" dominant-baseline="middle"><tspan x="835.5" y="519.5">rebuild</tspan><tspan x="835.5" y="533.5">snapshot</tspan></text></g>
