<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img">
<title>Drain eviction for the tree before marking its data handle outdated</title>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfcf" stroke-width="3"/></pattern>
<marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arrow-vis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="1200" height="470" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="16.0" y="22.0">Drain eviction for the tree before marking its data handle outdated</tspan></text>
<rect x="8" y="44" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="85.5">Step-down</tspan><tspan x="18.0" y="100.5">reconfiguration</tspan></text>
<rect x="8" y="188" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="229.5">Eviction</tspan><tspan x="18.0" y="244.5">thread</tspan></text>
<rect x="8" y="332" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="381.0">Reader</tspan></text>
<line x1="170" y1="448" x2="1186" y2="448" stroke="#999999" marker-end="url(#arrow-hb)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" fill="#777777" text-anchor="end" dominant-baseline="middle"><tspan x="1180.0" y="460.0">time</tspan></text>
<g><rect x="170.0" y="47" width="653.9" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="58.0">reconfigure(role=follower)</tspan></text></g>
<g><rect x="170.0" y="213" width="352.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="346.0" y="231.5">in-flight eviction of a page</tspan><tspan x="346.0" y="245.5">from this tree</tspan></text></g>
<g><rect x="170.0" y="335" width="737.7" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="346.0">search</tspan></text></g>
<g><rect x="186.8" y="69" width="184.4" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="279.0" y="80.5">exclusive eviction access:</tspan><tspan x="279.0" y="94.5">stop new eviction, clear</tspan><tspan x="279.0" y="108.5">walk, drop candidates</tspan></text></g>
<g><rect x="186.8" y="357" width="704.2" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="538.9" y="382.5">reader keeps using the old stable B-tree</tspan></text></g>
<g><rect x="388.0" y="69" width="134.1" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="391.0" y="85.5" width="128.1" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="455.0" y="94.5">waits for eviction</tspan></text></g>
<g><rect x="538.9" y="69" width="134.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="605.9" y="87.5">mark data handle</tspan><tspan x="605.9" y="101.5">outdated</tspan></text></g>
<g><rect x="538.9" y="213" width="268.3" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="588.8" y="229.5" width="168.4" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="673.0" y="238.5">no eviction of this tree</tspan></text></g>
<g><path d="M522.1,188.0 L522.1,165.0 L538.9,165.0 L538.9,145.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="546.9" y="165.0">drained</tspan></text></g>
<g><rect x="689.8" y="69" width="117.4" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="748.5" y="87.5">re-enable</tspan><tspan x="748.5" y="101.5">eviction</tspan></text></g>
<g><rect x="823.9" y="213" width="201.2" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.9" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="924.5" y="231.6">retain pages that cannot be</tspan><tspan x="924.5" y="245.4">read back from shared storage</tspan></text></g>
<g><rect x="924.5" y="335" width="100.6" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="931.5" y="346.0">close</tspan></text></g>
<g><rect x="941.3" y="357" width="67.1" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="974.8" y="375.5">release</tspan><tspan x="974.8" y="389.5">handle</tspan></text></g>
<g><rect x="1041.9" y="213" width="134.1" height="51" rx="5" fill="#e3f6e5" stroke="#2e8b3e" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.9" font-weight="normal" fill="#14531f" text-anchor="middle" dominant-baseline="middle"><tspan x="1108.9" y="231.6">discard remaining</tspan><tspan x="1108.9" y="245.4">pages, no reconcile</tspan></text></g>
<g><path d="M1008.3,332.0 L1008.3,309.0 L1041.9,309.0 L1041.9,289.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="1049.9" y="309.0">last user gone</tspan></text></g>
</svg>
