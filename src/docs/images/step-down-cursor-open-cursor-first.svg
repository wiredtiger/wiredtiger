<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" width="1200" height="326" role="img">
<title>The cursor takes the schema lock first: its live view is included in the walk</title>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfcf" stroke-width="3"/></pattern>
<marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arrow-vis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="1200" height="326" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="16.0" y="22.0">The cursor takes the schema lock first: its live view is included in the walk</tspan></text>
<rect x="8" y="44" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="85.5">Step-down</tspan><tspan x="18.0" y="100.5">reconfiguration</tspan></text>
<rect x="8" y="188" width="1184" height="98" rx="8" fill="#f5f6f8" stroke="#c9ccd2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="bold" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="18.0" y="237.0">Cursor operation</tspan></text>
<line x1="170" y1="304" x2="1186" y2="304" stroke="#999999" marker-end="url(#arrow-hb)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" fill="#777777" text-anchor="end" dominant-baseline="middle"><tspan x="1180.0" y="316.0">time</tspan></text>
<g><rect x="170.0" y="191" width="263.1" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="177.0" y="202.0">search</tspan></text></g>
<g><rect x="177.7" y="213" width="100.6" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="228.0" y="231.5">load role</tspan><tspan x="228.0" y="245.5">= leader</tspan></text></g>
<g><rect x="216.4" y="47" width="727.4" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="223.4" y="58.0">reconfigure(role=follower)</tspan></text></g>
<g><rect x="224.2" y="69" width="201.2" height="51" rx="5" fill="url(#hatch)" stroke="#888888" stroke-dasharray="4 3" stroke-width="1.2"/><rect x="250.5" y="85.5" width="148.6" height="18" rx="3" fill="#ffffff" opacity="0.9"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle" dominant-baseline="middle"><tspan x="324.8" y="94.5">waits for schema lock</tspan></text></g>
<g><rect x="293.8" y="213" width="131.6" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="359.6" y="231.5">fresh open of</tspan><tspan x="359.6" y="245.5">live B-tree view</tspan></text></g>
<g><rect x="293.8" y="268" width="131.6" height="13" rx="3" fill="#d9c8f2" stroke="#7e5bb5" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="359.6" y="274.8">schema lock</tspan></text></g>
<g><rect x="440.8" y="124" width="495.3" height="13" rx="3" fill="#d9c8f2" stroke="#7e5bb5" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a2a2a" text-anchor="middle" dominant-baseline="middle"><tspan x="688.5" y="130.8">schema lock held by the step-down reconfiguration</tspan></text></g>
<g><rect x="440.8" y="69" width="170.2" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="526.0" y="88.1">mark this data handle</tspan><tspan x="526.0" y="100.9">outdated (eviction drained)</tspan></text></g>
<g><path d="M425.4,188.0 L425.4,165.0 L440.8,165.0 L440.8,145.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow-hb)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="bold" fill="#111111" text-anchor="start" dominant-baseline="middle"><tspan x="448.8" y="165.0">lock hand-off</tspan></text></g>
<g><rect x="448.6" y="191" width="557.2" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="455.6" y="202.0">search / next</tspan></text></g>
<g><rect x="456.3" y="213" width="541.7" height="51" rx="5" fill="#e3f6e5" stroke="#2e8b3e" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#14531f" text-anchor="middle" dominant-baseline="middle"><tspan x="727.2" y="238.5">existing cursors keep reading the old stable B-tree (protected by eviction synchronization)</tspan></text></g>
<g><rect x="626.6" y="69" width="131.6" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="692.3" y="87.5">publish role</tspan><tspan x="692.3" y="101.5">= follower</tspan></text></g>
<g><rect x="843.2" y="69" width="92.9" height="51" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle"><tspan x="889.7" y="87.5">release</tspan><tspan x="889.7" y="101.5">schema lock</tspan></text></g>
<g><rect x="1021.2" y="191" width="154.8" height="92" rx="7" fill="#e9edf5" stroke="#8592ab" stroke-width="1.2"/><text font-family="Menlo, Consolas, monospace" font-size="11.0" font-weight="bold" fill="#2f3b55" text-anchor="start" dominant-baseline="middle"><tspan x="1028.2" y="202.0">search</tspan></text></g>
<g><rect x="1029.0" y="213" width="139.3" height="51" rx="5" fill="#e3f6e5" stroke="#2e8b3e" stroke-width="1.4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="normal" fill="#14531f" text-anchor="middle" dominant-baseline="middle"><tspan x="1098.6" y="231.5">later reopen:</tspan><tspan x="1098.6" y="245.5">checkpoint view</tspan></text></g>
</svg>
