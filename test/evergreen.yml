- name: amazon2023-arm64-asan
  display_name: "! Amazon2023 ARM64 ASAN"
  run_on:
  - amazon2023.3-arm64-small
  expansions:
    CMAKE_TOOLCHAIN_FILE: -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchains/clang.cmake
    CMAKE_BUILD_TYPE: -DCMAKE_BUILD_TYPE=ASan
    ENABLE_TCMALLOC: 0
    additional_env_vars: |
      export LSAN_OPTIONS="$COMMON_SAN_OPTIONS:allocator_may_return_null=1:print_suppressions=0:suppressions=$(git rev-parse --show-toplevel)/test/evergreen/asan_leaks.supp"
    # Parallel execution hides ASAN warnings for python tests. Force sequential execution of python
    # tests by setting num_jobs to 1.
    # FIXME-WT-16067: AFAIK even with num_jobs=1 some tests (e.g. format.sh) could be executed in
    # a separate process. It's worth investigating whether it could lead to hiding some warnings.
    num_jobs: 1
    # Exclude wt12015_backup_corruption for ASan builds. It creates false positives when it deliberately kills processes that invoke corruption.
    unit_test_ignore: test/suite/asan.fail
    unit_test_variant_args: --asan
    additional_san_vars: export ASAN_OPTIONS="$COMMON_SAN_OPTIONS:unmap_shadow_on_exit=1"
    ctest_extra_args: -E "wt12015_backup_corruption"
  tasks:
    - name: ".pull_request !.pull_request_compilers !.unit_test_xsan !.python !.tiered_unittest !csuite-wt12015-backup-corruption-test !.unit_test_tsan !syscall-linux !chunkcache-test"
