  - name: compatibility-test-against-develop
    depends_on:
    - name: compile
    - name: compile-develop
    commands:
      # Fetch artifact for the compile build.
      - func: "fetch artifacts"
      # Fetch artifact for the compile-develop build.
      - func: "fetch artifacts"
        vars:
          dependent_task: compile-develop
          destination: "wiredtiger-develop"
      # Run format using the binary in the compile build.
      - func: "run format test to generate datafiles"
        vars:
          format_binary_dir: "wiredtiger/cmake_build/test/format"
          format_config_dir: "wiredtiger/test/format"
      # Run format using the binary in the compile-develop build.
      - func: "run format test to generate datafiles"
        vars:
          format_binary_dir: "wiredtiger-develop/cmake_build/test/format"
          format_config_dir: "wiredtiger-develop/test/format"
      # Verify data files generated in wiredtiger-develop using binary built from the compile build.
      - func: "verify wt datafiles with binary"
        vars:
          build_dir: "wiredtiger/cmake_build"
          data_dir: "wiredtiger-develop/cmake_build/test/format/RUNDIR"
      # Verify data files generated in wiredtiger using binary built from the compile-develop build.
      - func: "verify wt datafiles with binary"
        vars:
          build_dir: "wiredtiger-develop/cmake_build"
          data_dir: "wiredtiger/cmake_build/test/format/RUNDIR"
      # Upload both folders as artifacts.
      - func: "upload artifact for compatibility test"
      # To prevent the default post task re-archiving again.
      - func: "cleanup"

