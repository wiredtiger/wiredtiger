          format_test_script_args: -c ../../../test/format/CONFIG.disagg -t 10 -- disagg.mode=follower runs.rows=10000 runs.ops=50000

  - name: format-stress-test-disagg-leader-tsan
    tags: ["pull_request"]
    depends_on:
      - name: compile
    commands:
      - func: "fetch artifacts"
      - func: "format test disagg"
        vars:
          # Limit the number of operations to avoid an internal TSAN issue; run more operations with detect_deadlocks=0.
          # FIXME-WT-16313: Consider how to avoid the internal TSAN issue.
          format_args: disagg.mode=leader runs.rows=1000:3000 runs.tables=1:3 runs.ops=3000
          times: 3
      - func: "format test disagg"
        vars:
          format_args: disagg.mode=leader runs.rows=100000:300000 runs.tables=1:3 runs.ops=300000
          additional_san_vars: export TSAN_OPTIONS="$TSAN_OPTIONS:detect_deadlocks=0"
          times: 3

